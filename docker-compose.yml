name: hookgate

# `docker compose up --build` starts everything (NFR-5). `make up` starts only the
# infrastructure (postgres, redis, rabbitmq) for local development and tests.
# Credentials and secrets below are local, non-secret development values.

x-app: &app
  build: .
  image: hookgate:local
  environment:
    DATABASE_URL: postgresql+psycopg://hookgate:hookgate@postgres:5432/hookgate?connect_timeout=5
    REDIS_URL: redis://redis:6379/0
    BROKER_URL: amqp://hookgate:hookgate@rabbitmq:5672//
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-only-webhook-secret-change-me}
    ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-only-admin-key-change-me}
    LEASE_S: ${LEASE_S:-60}
    SWEEP_INTERVAL_S: ${SWEEP_INTERVAL_S:-15}
    WORKER_METRICS_PORT: 9100

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hookgate
      POSTGRES_PASSWORD: hookgate
      POSTGRES_DB: hookgate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookgate -d hookgate"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: hookgate
      RABBITMQ_DEFAULT_PASS: hookgate
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    <<: *app
    command: ["celery", "-A", "hookgate.worker", "worker", "--pool", "threads", "--concurrency", "8", "--loglevel", "INFO"]
    ports:
      - "127.0.0.1:9100:9100"  # worker metrics (Prometheus text format)
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  beat:
    <<: *app
    command: ["celery", "-A", "hookgate.worker", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # Demo only: `docker compose --profile demo run --rm simulator` (chaos, seed 7), or pass
  # your own arguments, e.g. `... run --rm simulator run --scenario poison --seed 3`.
  simulator:
    image: hookgate:local
    profiles: ["demo"]
    entrypoint: ["python", "-m", "simulator"]
    command: ["run", "--scenario", "chaos", "--seed", "7"]
    environment:
      HOOKGATE_URL: http://api:8000
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-only-webhook-secret-change-me}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-only-admin-key-change-me}
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  postgres-data: